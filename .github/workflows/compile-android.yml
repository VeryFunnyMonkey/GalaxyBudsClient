name: Compile Android binaries

on:
  push:
    branches: [ master, project-upgrade ]
  pull_request:
    branches: [ master ]
  release:
    types:
      - published
      - prereleased
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.101

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-levels: 34
        components: build-tools;34.0.0

    - name: Install Android workload
      run: dotnet workload install android

    - name: Restore dependencies
      working-directory: GalaxyBudsClient.Android
      run: dotnet restore GalaxyBudsClient.Android.csproj

    - name: Generate debug keystore
      working-directory: GalaxyBudsClient.Android
      run: |
        mkdir -p keystore
        keytool -genkeypair \
          -v \
          -keystore keystore/debug.keystore \
          -storepass debugpass \
          -alias galaxybudsclient \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=GalaxyBudsClient, OU=Dev, O=Org, L=City, ST=State, C=US"

    - name: Build Android APK
      working-directory: GalaxyBudsClient.Android
      run: |
        dotnet publish GalaxyBudsClient.Android.csproj \
          -f net8.0-android \
          -c Release \
          -p:AndroidPackageFormats=apk \
          -p:EmbedAssembliesIntoApk=true \
          -p:NotDemo=true \
          -p:AndroidKeyStore=true \
          -p:AndroidSigningKeyStore=keystore/debug.keystore \
          -p:AndroidSigningKeyAlias=galaxybudsclient \
          -p:AndroidSigningKeyPass=debugpass \
          -p:AndroidSigningStorePass=debugpass \
          -o bin_android

    - name: Find APK
      id: find_apk
      working-directory: GalaxyBudsClient.Android
      run: |
        APK_PATH=$(find bin_android -type f -name "*.apk" | head -n 1)
        echo "apk=$APK_PATH" >> $GITHUB_OUTPUT

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: GalaxyBudsClient_Android
        path: ${{ steps.find_apk.outputs.apk }}

  attach-to-release:
    runs-on: windows-latest
    needs: build-android
    if: github.event_name == 'release'

    steps:
    - name: Download artifact (Android)
      uses: actions/download-artifact@v4
      with:
        name: GalaxyBudsClient_Android

    - name: Rename APK
      run: ren *.apk GalaxyBudsClient_Android.apk

    - uses: AButler/upload-release-assets@v2.0
      with:
        files: '*.apk'
        repo-token: ${{ secrets.GH_TOKEN }}
