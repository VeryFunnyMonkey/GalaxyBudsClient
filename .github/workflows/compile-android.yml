name: Compile Android APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  release:
    types:
      - published
      - prereleased
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.101

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
      with:
        api-level: 34
        ndk: 25.2.9519653
        arch: arm64
        cmdline-tools: latest

    - name: Generate debug keystore
      run: |
        mkdir -p keystore
        keytool -genkeypair -v \
          -keystore keystore/debug.keystore \
          -alias galaxybudsclient \
          -keyalg RSA -keysize 2048 \
          -validity 10000 \
          -storepass debugpass \
          -keypass debugpass \
          -dname "CN=Debug, OU=Dev, O=Test, L=City, S=State, C=US"

    - name: Restore workloads
      run: dotnet workload restore

    - name: Build Signed APK (arm64)
      run: |
        dotnet publish GalaxyBudsClient.Android/GalaxyBudsClient.Android.csproj \
          -f net8.0-android \
          -c Release \
          -r android-arm64 \
          -p:AndroidKeyStore=true \
          -p:AndroidSigningKeyStore=keystore/debug.keystore \
          -p:AndroidSigningKeyAlias=galaxybudsclient \
          -p:AndroidSigningKeyPass=debugpass \
          -p:AndroidSigningStorePass=debugpass \
          -p:AndroidPackageFormats=apk \
          -p:EmbedAssembliesIntoApk=true \
          -p:NotDebuggable=true \
          -o bin_android

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: GalaxyBudsClient_android-arm64
        path: bin_android/*.apk
